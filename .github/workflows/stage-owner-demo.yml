name: Publish verified full owner demo export
on:
  push:
    branches: [staging/little-me-owner-demo-export]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node scripts/publish-static-artifact.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PROJECT: little-me-owner-demo
          INPUT_BLOB_SHA: 2fca9f48f6c5569a73b4ac9c72c4d0cfe7ab4000
          INPUT_SHA256: 800ae01edb59706f9538ac07de86b4770494d821c1ddfe1759de474f9db0271d
          INPUT_SOURCE_SHA: 53385dc0bff1753b29a664a246e4f8a486daec73
